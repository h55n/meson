name: fork-only Windows Objective-C linker probe
on:
  push:
    branches: [ci-azure-link-probe-16301]
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [d12465d96360c69a7aae532c17945770c91f0834, 2c24358241668638ce94864b321e5d03d0dbdecc]
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: Copy-Item diagnostics/link-probe.py $env:RUNNER_TEMP/link-probe.py
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: pwsh
        run: |
          $env:Path = ($env:Path.Split(';') | Where-Object { $_ -notmatch 'mingw|Strawberry|Chocolatey|PostgreSQL' }) -join ';'
          python -m pip install ninja
          Copy-Item $env:RUNNER_TEMP/link-probe.py ./link-probe-diagnostic.py
          python ./link-probe-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linker-probe-${{ matrix.source }}
          path: ${{ runner.temp }}/link-probe
          retention-days: 7
