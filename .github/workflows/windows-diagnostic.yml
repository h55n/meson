name: Windows custom-command diagnostic
on:
  push:
    branches: [ci-diagnose-windows-16301]
    paths: [.github/workflows/windows-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: [d12465d96360c69a7aae532c17945770c91f0834, 1d1556274c18487bab1e40b3e9ebe90126e49d2b]
        workers: [1, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: pwsh
        run: python -m pip install pytest-xdist pytest-subtests fastjsonschema pefile
      - name: Repeat only affected generator projects (diagnostic, not full suite)
        shell: pwsh
        env:
          MESON_CI_JOBNAME: windows-diagnostic
        run: |
          $env:Path = ($env:Path.Split(';') | Where-Object { $_ -notmatch 'mingw|Strawberry|Chocolatey|PostgreSQL' }) -join ';'
          $failed = 0
          for ($i = 1; $i -le 5; $i++) {
            Write-Output "DIAGNOSTIC ITERATION $i"
            python run_project_tests.py --backend vs2022 -j ${{ matrix.workers }} --only 'common/179 ' 'common/208 ' 'common/227 ' 'native/3 ' 'native/7 ' 'native/9 '
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Output "FAILED ITERATIONS: $failed"
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-35); Id=1000,1001} -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
          if ($failed -gt 0) { exit 1 }
